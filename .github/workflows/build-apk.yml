name: Build Android app (APK)

# Run it by hand: GitHub > Actions > "Build Android app (APK)" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Your deployed server address (https, no trailing slash), e.g. https://aquafind.onrender.com"
        required: true
        default: "https://aquafind.onrender.com"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Prepare Android SDK
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - name: Point the app at your server
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          API_BASE="${API_BASE%/}"
          case "$API_BASE" in https://*) ;; *) echo "Server address must start with https://"; exit 1;; esac
          printf "window.AQF_API_BASE = '%s';\n" "$API_BASE" > frontend/config.js
          cat frontend/config.js

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M" || { echo "Could not add location permission"; exit 1; }

      - name: App icon
        working-directory: mobile
        run: |
          # The real AquaFind logo layers are committed in mobile/assets (icon-only, icon-foreground, icon-background)
          # so the Android launcher icon (round, square and adaptive) shows the logo, not the Capacitor placeholder.
          mkdir -p assets
          for f in icon-only icon-foreground icon-background; do
            test -f "assets/$f.png" || { echo "Missing mobile/assets/$f.png - upload the three logo PNGs into the mobile/assets folder of your repo"; exit 1; }
          done
          sudo apt-get update && sudo apt-get install -y imagemagick
          npm install --no-save @capacitor/assets
          # Splash screen: the logo centered on the same deep blue as the startup animation
          convert -size 2732x2732 xc:'#12427A' \( ../frontend/icons/icon-512.png -resize 700x700 \) -gravity center -composite assets/splash.png
          cp assets/splash.png assets/splash-dark.png
          npx capacitor-assets generate --android --splashBackgroundColor '#12427A' --splashBackgroundColorDark '#12427A'
          # Make sure the adaptive icon layer was generated
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Build the APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AquaFind.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AquaFind-apk
          path: AquaFind.apk

      - name: Put the APK on your site's download button
        continue-on-error: true
        run: |
          cp AquaFind.apk frontend/downloads/AquaFind.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/downloads/AquaFind.apk
          git commit -m "Update Android app [skip ci]"
          git push
