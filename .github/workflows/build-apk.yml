name: Build Android app (APK)

# Run it by hand: GitHub > Actions > "Build Android app (APK)" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Your deployed server address (https, no trailing slash), e.g. https://aquafind.onrender.com"
        required: true
        default: "https://aquafind.onrender.com"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Point the app at your server
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          API_BASE="${API_BASE%/}"
          case "$API_BASE" in https://*) ;; *) echo "Server address must start with https://"; exit 1;; esac
          printf "window.AQF_API_BASE = '%s';\n" "$API_BASE" > frontend/config.js
          cat frontend/config.js

      - name: Create the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />#' "$M"
          grep -q ACCESS_FINE_LOCATION "$M" || { echo "Could not add location permission"; exit 1; }

      - name: App icon
        working-directory: mobile
        continue-on-error: true
        run: |
          mkdir -p assets
          convert assets/icon-512-source.png -resize 1024x1024 assets/icon-only.png
          npm install --no-save @capacitor/assets
          npx capacitor-assets generate --android --iconBackgroundColor '#EEF6FC' --iconBackgroundColorDark '#EEF6FC'

      - name: Build the APK
        working-directory: mobile
        run: |
          npx cap sync android
          cd android && ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AquaFind.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AquaFind-apk
          path: AquaFind.apk

      - name: Put the APK on your site's download button
        continue-on-error: true
        run: |
          cp AquaFind.apk frontend/downloads/AquaFind.apk
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/downloads/AquaFind.apk
          git commit -m "Update Android app [skip ci]"
          git push