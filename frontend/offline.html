<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF6FC"><title>Offline · AquaFind</title>
<style>
:root{color-scheme:light}
html,body{height:100%;margin:0}
body{display:grid;place-items:center;background:#EEF6FC;color:#102A43;font-family:Inter,'Segoe UI',system-ui,sans-serif;padding:max(24px,env(safe-area-inset-top)) 24px max(24px,env(safe-area-inset-bottom))}

p{margin:0 0 24px;line-height:1.55;color:#5A6A7E;font-size:15px}
button{font:inherit;font-weight:600;min-height:48px;padding:0 24px;border:0;border-radius:15px;background:linear-gradient(135deg,#1A73C9,#2196F3);color:#fff;cursor:pointer}
</style></head><body><main>
<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="a" gradientUnits="userSpaceOnUse" x1="10" y1="54" x2="50" y2="8"><stop offset="0" stop-color="#38BDF8"/><stop offset="1" stop-color="#2196F3"/></linearGradient><linearGradient id="w" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2196F3"/><stop offset="1" stop-color="#102A43"/></linearGradient></defs><path d="M18.9 37c4.3-5.5 8.6-5.5 13.1 0s8.8 5.5 13.1 0L53 54H11z" fill="url(#w)"/><path d="M11 54 32 9l21 45" fill="none" stroke="url(#a)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 47c4.500-4.500 9-4.500 14.500 0s10 4.500 14.500 0" fill="none" stroke="#38BDF8" stroke-width="3.2" stroke-linecap="round"/></svg>

<p>AquaFind needs a connection to show live water availability. Station status is never shown from memory, so reconnect and try again.</p>
<button id="retry" type="button">Try again</button>
</main>
<script src="/offline.js"></script></body></html>
